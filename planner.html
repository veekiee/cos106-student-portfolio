
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Planner</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>My Academic Planner</h1>

    <p>Organise your academic activities and assignments.</p>

    <form id="task-form">
        <label for="task-input">Enter a task:</label>
        <input type="text" id="task-input" placeholder="Enter your task">
        <button type="submit">Add Task</button>
    </form>

    <h2>My Tasks</h2>
    <ul id="task-list"></ul>

</body>
</html>
